# =============================================================================
# Channel: kittens_puppies
# =============================================================================
# The creative vocabulary for the flagship account. Every option is a building
# block the concept generator combines; the tag algebra keeps combinations
# coherent (no Santa hats at the beach) while still being effectively endless.
#
# HOW TAGS WORK
#   tags      : what this option contributes to the growing context
#   requires  : only offered when ALL of these tags are already in context
#   excludes  : never offered when ANY of these tags is in context
#   weight    : relative likelihood (1.0 = normal, 0.4 = rarer, 2.0 = favoured)
#
# Sampling order is: occasions -> themes -> settings -> palettes -> lighting
#   -> animals -> accessories -> dance_styles -> camera_moves -> transitions
#   -> effects -> music_vibes
# So an option can only `require` a tag contributed by an earlier pool.
#
# ADDING CONTENT: append entries. No code changes, no restart. The novelty
# ledger will start favouring your new options immediately because unused
# options carry no recency penalty.
# =============================================================================

display_name: "Paw Party"
description: >-
  Adorable AI-generated kittens and puppies dancing through endlessly varied
  party themes. Bright, wholesome, funny, family-friendly, loop-friendly.

# -----------------------------------------------------------------------------
# Structure — how videos are shaped
# -----------------------------------------------------------------------------
structure:
  # Chance that a video leans into the current month's holiday/season.
  # Above ~0.35 the feed starts to feel like a single-holiday account.
  seasonal_bias: 0.22

  # Solo / duo / trio. Duos win on comments ("which one?"), so they dominate.
  cast_size_weights:
    "1": 0.28
    "2": 0.50
    "3": 0.22

  loop_strategies:
    - crossfade_to_start
    - crossfade_to_start
    - freeze_hold
    - hard_cut

  # Length archetypes. Mixing them keeps the account's retention profile broad.
  duration_bands:
    - id: snap
      label: "Snap loop"
      min_s: 9
      max_s: 13
      beat_count: [2, 3]
      weight: 0.28
      notes: "Maximum loop rate. One idea, one punchline, repeat."
    - id: short
      label: "Short set"
      min_s: 14
      max_s: 21
      beat_count: [3, 4]
      weight: 0.32
      notes: "Hook + two escalations + payoff. The workhorse."
    - id: standard
      label: "Standard"
      min_s: 22
      max_s: 32
      beat_count: [4, 6]
      weight: 0.26
      notes: "Room for a real switch beat and a costume change."
    - id: extended
      label: "Extended"
      min_s: 33
      max_s: 45
      beat_count: [6, 8]
      weight: 0.14
      notes: "Mini-narrative. Only worth it when the concept has stages."

# -----------------------------------------------------------------------------
# Prompt style — the look, applied to every generation prompt
# -----------------------------------------------------------------------------
prompt_style:
  render_style: >-
    hyper-cute 3D animated short film look, Pixar-quality fur shading with
    visible individual hairs, soft subsurface scattering, glossy expressive eyes,
    squash-and-stretch animation
  quality_anchor: >-
    crisp 4K detail, cinematic depth of field, professional colour grade,
    60fps-smooth motion
  base_negatives: "ugly, deformed, disfigured, low quality, photorealistic gore"

# -----------------------------------------------------------------------------
# Safety — this is a family-friendly account; the floor is not negotiable
# -----------------------------------------------------------------------------
safety:
  negative_prompt_extra: >-
    sad animal, crying, scared, abandoned, thin, sick, wound, vet, cage,
    aggressive, snarling, teeth bared, fighting, human hands grabbing
  banned_words:
    - kill
    - dead
    - die
    - hate
    - stupid
    - ugly
    - fight
    - drunk
    - sexy
    - hot girl

