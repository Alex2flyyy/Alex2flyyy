# -----------------------------------------------------------------------------
# Copy — captions, hooks, pinned comments
# -----------------------------------------------------------------------------
# Placeholders available: {dance} {theme} {setting} {animal} {animals} {lead}
#                         {music} {payoff_hint} {occasion} {emoji}
copy:
  caption_count: 5
  max_caption_chars: 90
  max_hook_chars: 42
  max_emoji: 2

  emoji: ["🐱", "🐶", "✨", "🥹", "😭", "🕺", "💃", "🐾", "🎉", "😻"]

  voice_rules:
    - "Warm, playful, never sarcastic."
    - "Talk to one person, not an audience."
    - "Ask something answerable in three words."
    - "Never explain the joke."
    - "No baby-talk spelling."

  # Ranking favours questions, ratings and comparisons, so most patterns lean
  # that way — but keep a few statements so the feed doesn't read as a quiz.
  caption_patterns:
    - "Rate this {dance} from 1-10 {emoji}"
    - "Which one wins? {emoji}"
    - "Who did it better? {emoji}"
    - "Too cute to scroll past {emoji}"
    - "Wait for the {payoff_hint} {emoji}"
    - "{theme} but make it adorable {emoji}"
    - "Name a better duo. I'll wait {emoji}"
    - "The {lead} understood the assignment {emoji}"
    - "Tell me this isn't the best {dance} you've seen today {emoji}"
    - "POV: you found the {theme} {emoji}"
    - "This took 47 takes {emoji}"
    - "Team {animal}? {emoji}"
    - "Watch it twice. You'll spot it {emoji}"
    - "{music} was the right call {emoji}"
    - "Stop scrolling. {emoji}"
    - "The confidence is unmatched {emoji}"
    - "Would you survive this {dance}? {emoji}"
    - "Send this to someone who needs it today {emoji}"

  onscreen_hooks:
    - "WAIT FOR IT"
    - "RATE THIS 1-10"
    - "WHO DID IT BETTER?"
    - "POV: {theme}"
    - "DON'T SCROLL"
    - "WATCH THE ENDING"
    - "PICK YOUR FIGHTER"
    - "THE CONFIDENCE"
    - "IT GETS BETTER"

  comment_seeds:
    - "Team {animal} or nah? 👀"
    - "Drop a 🐾 if you'd adopt {lead}"
    - "Which one had the better moves?"
    - "Rate the ending out of 10 👇"
    - "Who should dance next?"
    - "Be honest — could you do this?"

# -----------------------------------------------------------------------------
# Hashtags
# -----------------------------------------------------------------------------
hashtags:
  max_total: 8
  broad_count: 2
  rotating_count: 1

  # Constant — these define the account to the algorithm. Change rarely.
  core:
    - cutepets
    - aianimals
    - dancingpets

  # High-volume discovery tags. Two per post, sampled.
  broad:
    - fyp
    - foryou
    - viral
    - cute
    - animals
    - petsoftiktok

  # OPERATOR-MAINTAINED. Add trends you have actually verified in the app.
  # Deliberately not auto-fetched — TikTok has no public trending API and
  # scraping one would be a fragile, ToS-risky dependency in a daily job.
  rotating:
    - aiart
    - catsoftiktok
    - dogsoftiktok
    - puppylove
    - kittenvideos

  occasions:
    christmas: [christmas, holidaypets]
    halloween: [halloween, spookyseason]
    valentines: [valentines, valentinesday]
    new_year: [newyear, newyearseve]
    summer: [summervibes]
    spring: [springvibes]
    autumn: [fallvibes]
    birthday: [birthday]
    easter: [easter]
    st_patricks: [stpatricksday]

  # Tags that only make sense for one species. A cat tag on a dogs-only video
  # pulls the wrong audience, who then scroll — worse than no tag at all.
  # Anything listed here is dropped unless that species is in the cast.
  species_tags:
    kitten: [catsoftiktok, catlover, kittenvideos, catsofinstagram, aicats, dancingcats]
    puppy: [dogsoftiktok, puppylove, dogsofinstagram, aidogs, dancingdogs, doglover]

  # Never emit these — banned, shadow-limited, or off-brand.
  banned:
    - followforfollow
    - like4like
