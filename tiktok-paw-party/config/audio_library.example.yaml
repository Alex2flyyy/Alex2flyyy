# =============================================================================
# Example music library manifest
# =============================================================================
# Copy this to Videos/Audio/library/library.yaml and describe your own licensed
# tracks, then set `providers.music: local_library` in config/settings.yaml.
#
# Tracks are scored against each concept's music vibe tags and BPM, so the tags
# here are what make selection sensible. Files present in the folder but absent
# from this manifest still work — they just can't be matched on vibe.
#
# The `license` field is not read by the code. It exists so that in eighteen
# months you can answer "where did this track come from?" without guessing.
# See docs/LEGAL.md.
# =============================================================================

