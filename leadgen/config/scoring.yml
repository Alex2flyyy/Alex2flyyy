# Domains that are a *social page used as the website*. These are not chains —
# they are excellent prospects, because the owner clearly wants a web presence
# and settled for a Facebook page.
social_as_website_domains:
  - facebook.com
  - m.facebook.com
  - instagram.com
  - linktr.ee
  - linkedin.com
  - nextdoor.com

# Free-tier site builders: real prospects, weak setups.
free_builder_domains:
