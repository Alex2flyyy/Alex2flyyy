# =============================================================================
# Niche catalog
# =============================================================================
# Each niche maps a human label onto the machinery the discovery providers need:
#
#   place_types      Google Places "includedTypes" values (Places API New).
#                    Empty list => text-search only.
#   keywords         Free-text queries used for text search and for providers
#                    that have no type taxonomy (OSM, SerpAPI).
#   osm_tags         Overpass tag filters, "key=value".
#   demand           0.0-1.0. How badly this niche needs a website to win
#                    customers. Restaurants live and die by Maps + menu; a
#                    machine shop with three industrial clients does not.
#   competition      0.0-1.0. Local saturation. High competition raises the
#                    value of standing out, so it *increases* lead score.
#   ticket           0.0-1.0. Proxy for what the business can pay. Drives the
#                    revenue-potential component of the lead score.
#   web_expectation  What a "normal" site looks like in this niche. Used by the
#                    AI enrichment prompt so the pitch is niche-appropriate.
#
# Add a niche by appending a block. Nothing else in the codebase needs editing.
# =============================================================================

niches:
  - key: restaurants
    label: Restaurants
    place_types: [restaurant, meal_takeaway, cafe]
    keywords: ["restaurant", "family restaurant", "taqueria", "diner"]
    osm_tags: ["amenity=restaurant", "amenity=fast_food"]
    demand: 0.95
    competition: 0.95
    ticket: 0.45
    web_expectation: "menu, hours, online ordering link, photos, reservations"

