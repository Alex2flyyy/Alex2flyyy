[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
# sqlalchemy.url is injected at runtime from LEADGEN_DATABASE_URL — see
# migrations/env.py.  Leaving it blank here avoids committing credentials.
sqlalchemy.url =

[post_write_hooks]
# `exec`, not `console_scripts`: ruff ships a compiled binary and does not
# register the console_scripts entrypoint alembic's other hook type looks up.
# With console_scripts, `alembic revision` aborts with exit 255 after writing
# the file — the migration exists but the command reports failure, which fails
# CI. `exec` invokes the binary on PATH and works.
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
