name: Daily lead generation

# Runs the pipeline every morning and publishes the report as a downloadable
# artifact. This is the zero-infrastructure option: no server to maintain, and
# GitHub keeps the run history and logs for you.
#
# It needs a database reachable from GitHub's runners (Neon, Supabase, RDS —
# any managed Postgres). If your database is private, use the self-hosted
# scheduler in docker-compose.yml instead.

on:
  schedule:
    # 06:15 America/Los_Angeles. GitHub cron is UTC and does not follow DST, so
    # this fires at 06:15 PDT in summer and 05:15 PST in winter. Shift the hour
    # if that matters to you.
    - cron: "15 13 * * *"
  workflow_dispatch:
    inputs:
      location:
        description: "Location target key from config/locations.yml"
        required: false
        default: "home_base_25mi"
      niches:
        description: "Space-separated niche keys, or blank for all"
        required: false
        default: ""
      target:
        description: "Qualified leads wanted"
        required: false
        default: "50"

concurrency:
  # Never let a manual run collide with the scheduled one — two pipelines
  # against one database means doubled API spend for the same leads.
  group: daily-leads
  cancel-in-progress: false

defaults:
  run:
    working-directory: leadgen

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      LEADGEN_ENV: production
      LEADGEN_LOG_FORMAT: json
      LEADGEN_DATABASE_URL: ${{ secrets.LEADGEN_DATABASE_URL }}
      LEADGEN_API_KEY: ${{ secrets.LEADGEN_API_KEY }}
      LEADGEN_GOOGLE_MAPS_API_KEY: ${{ secrets.LEADGEN_GOOGLE_MAPS_API_KEY }}
      LEADGEN_PAGESPEED_API_KEY: ${{ secrets.LEADGEN_PAGESPEED_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LEADGEN_AIRTABLE_API_KEY: ${{ secrets.LEADGEN_AIRTABLE_API_KEY }}
      LEADGEN_AIRTABLE_BASE_ID: ${{ secrets.LEADGEN_AIRTABLE_BASE_ID }}
      LEADGEN_NOTION_API_KEY: ${{ secrets.LEADGEN_NOTION_API_KEY }}
      LEADGEN_NOTION_DATABASE_ID: ${{ secrets.LEADGEN_NOTION_DATABASE_ID }}
      LEADGEN_SLACK_WEBHOOK_URL: ${{ secrets.LEADGEN_SLACK_WEBHOOK_URL }}
      LEADGEN_EXPORT_DIR: ./data/exports
      LEADGEN_SCREENSHOT_DIR: ./data/screenshots

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: leadgen/pyproject.toml

      # A scheduled run with no database configured is "not set up yet", not a
      # failure. Failing here would paint the repository red every morning
      # until setup is finished, which trains you to ignore the one signal that
      # should mean something. A manual run still fails loudly, because you
      # asked for it and deserve to know why it did nothing.
      - name: Check configuration
        id: check
        run: |
          if [ -n "$LEADGEN_DATABASE_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Not configured yet"
              echo ""
              echo "\`LEADGEN_DATABASE_URL\` is not set, so this run did nothing."
              echo "Add it under **Settings → Secrets and variables → Actions**"
              echo "and the next scheduled run will pick it up automatically."
              echo ""
              echo "See \`leadgen/docs/DEPLOYMENT.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::LEADGEN_DATABASE_URL secret is not set."
              exit 1
            fi
            echo "::notice::Skipping scheduled run — no database configured yet."
          fi
          if [ -n "$LEADGEN_DATABASE_URL" ] && [ -z "$LEADGEN_GOOGLE_MAPS_API_KEY" ]; then
            echo "::warning::No Google Maps key — discovery falls back to OpenStreetMap only."
          fi

      - name: Install
        if: steps.check.outputs.configured == 'true'
        run: pip install -e .

      - name: Install browser
        if: steps.check.outputs.configured == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Apply migrations
        if: steps.check.outputs.configured == 'true'
        run: alembic upgrade head

      # Idempotent upsert, so it is safe every run. Without it the gazetteer is
      # empty and every city, county, and radius target resolves to zero search
      # cells — the pipeline then has nowhere to look.
      - name: Load the gazetteer
        if: steps.check.outputs.configured == 'true'
        run: leadgen geo seed

      - name: Run the pipeline
        id: run
        if: steps.check.outputs.configured == 'true'
        run: |
          NICHE_ARGS=""
          for n in ${{ github.event.inputs.niches }}; do NICHE_ARGS="$NICHE_ARGS --niche $n"; done
          leadgen --json-logs run-daily \
            --location "${{ github.event.inputs.location || 'home_base_25mi' }}" \
            --target "${{ github.event.inputs.target || 50 }}" \
            $NICHE_ARGS

      - name: Push to Airtable
        if: steps.check.outputs.configured == 'true' && env.LEADGEN_AIRTABLE_API_KEY != ''
        continue-on-error: true
        run: leadgen export airtable --limit 50

      - name: Summarize
        if: always() && steps.check.outputs.configured == 'true'
        run: |
          {
            echo "## Daily lead run"
            echo ""
            leadgen stats 2>/dev/null || echo "Stats unavailable."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always() && steps.check.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: leads-${{ github.run_number }}
          path: leadgen/data/exports/reports/
          retention-days: 90
          if-no-files-found: warn

      - name: Notify Slack on failure
        if: failure() && env.LEADGEN_SLACK_WEBHOOK_URL != ''
        run: |
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"Daily lead generation failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$LEADGEN_SLACK_WEBHOOK_URL"
