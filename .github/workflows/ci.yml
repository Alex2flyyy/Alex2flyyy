name: CI

on:
  push:
    branches: ["**"]
    paths: ["leadgen/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["leadgen/**", ".github/workflows/ci.yml"]

defaults:
  run:
    working-directory: leadgen

jobs:
  test:
    runs-on: ubuntu-latest

    # A real Postgres, because the schema depends on JSONB, array columns,
    # partial indexes, and ON CONFLICT. SQLite would pass tests that the
    # production database would fail.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leadgen
          POSTGRES_PASSWORD: leadgen
          POSTGRES_DB: leadgen_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leadgen"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      LEADGEN_ENV: test
      LEADGEN_AI_ENABLED: "false"
      LEADGEN_DATABASE_URL: postgresql+asyncpg://leadgen:leadgen@localhost:5432/leadgen_test
      TEST_DATABASE_URL: postgresql+asyncpg://leadgen:leadgen@localhost:5432/leadgen_test
      ALEMBIC_DATABASE_URL: postgresql+psycopg://leadgen:leadgen@localhost:5432/leadgen_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: leadgen/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy src/leadgen
        continue-on-error: true  # advisory until the codebase is fully annotated

      - name: Apply migrations
        run: alembic upgrade head

      - name: Verify migrations match the models
        # Autogenerate must produce an empty diff. If it doesn't, someone
        # changed a model without adding a migration, and production will
        # drift from the code.
        run: |
          alembic revision --autogenerate -m "drift check" --rev-id drift_check
          if grep -qE "op\.(create|drop|alter|add)_" migrations/versions/drift_check_*.py; then
            echo "::error::Models and migrations are out of sync. Run 'alembic revision --autogenerate'."
            cat migrations/versions/drift_check_*.py
            exit 1
          fi
          rm -f migrations/versions/drift_check_*.py

      - name: Test
        run: pytest --cov=leadgen --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t leadgen:ci --target api leadgen
